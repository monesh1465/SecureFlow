stages:
  - test
  - security
  - publish

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -v

semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error app/ run.py

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git --redact --exit-code 1

trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker info
    - docker build -t secureflow-api:$CI_COMMIT_SHA .
    - trivy image --scanners vuln --severity HIGH,CRITICAL --format table --exit-code 0 secureflow-api:$CI_COMMIT_SHA
    - trivy image --scanners vuln --severity HIGH,CRITICAL --format json --output trivy-report.json --exit-code 0 secureflow-api:$CI_COMMIT_SHA
    - trivy image --scanners vuln --severity CRITICAL --exit-code 1 secureflow-api:$CI_COMMIT_SHA
  artifacts:
    when: always
    paths:
      - trivy-report.json
    expire_in: 7 days

sonarqube-check:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=personal-group9905444_secureflow
      -Dsonar.organization=personal-group9905444
      -Dsonar.sources=app
      -Dsonar.tests=tests
      -Dsonar.python.version=3.12
      -Dsonar.qualitygate.wait=true
      -Dsonar.qualitygate.timeout=600

publish-image:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
