stages:
  - test
  - security

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -v

semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error app/ run.py

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git --redact --exit-code 1

trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TRIVY_NO_PROGRESS: "true"
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker info
    - docker build -t secureflow-api:$CI_COMMIT_SHA .
    - trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 secureflow-api:$CI_COMMIT_SHA
    - trivy image --scanners vuln --severity CRITICAL --exit-code 1 secureflow-api:$CI_COMMIT_SHA
