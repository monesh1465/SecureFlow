stages:
  - test
  - security

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -v

semgrep:
  stage: security
  image: semgrep/semgrep
  script:
    - semgrep scan --config auto --error app/ run.py

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git --redact --exit-code 1
